<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#ffd9b8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boba Tycoon" />
    <meta name="description" content="Make boba by hand, survive Drink Rushes, grow a tiny cart into a shop." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Boba Tycoon</title>
    <style>
      html, body { margin: 0; height: 100%; background: #ffd9b8; }
      #splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #ffd9b8; z-index: 100; transition: opacity 300ms ease;
        font: 900 28px ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; color: #4a2545;
      }
      #splash .cup { width: 64px; height: 84px; border-radius: 10px 10px 22px 22px; background: linear-gradient(#fff6 0 18%, #d9a36e 18%); border: 5px solid #4a2545; position: relative; animation: splashBob 700ms ease-in-out infinite alternate; }
      #splash .cup::after { content: ''; position: absolute; left: 50%; top: -34px; width: 12px; height: 50px; background: #ff6f91; border: 4px solid #4a2545; border-radius: 6px; transform: translateX(-50%) rotate(8deg); }
      @keyframes splashBob { to { transform: translateY(-8px) scale(1.04, 0.96); } }
    </style>
  </head>
  <body>
    <div id="splash"><div class="cup"></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
